name: ci

on:
  push:
    branches: [main, develop]
    paths-ignore:
      - "book/**"
      - "**.md"
      - ".github/workflows/book.yml"
      - ".github/workflows/benchmark*.yml"
      - ".github/workflows/examples.yml"
  pull_request:
    branches: [main, develop]
    paths-ignore:
      - "book/**"
      - "**.md"
      - ".github/workflows/book.yml"
      - ".github/workflows/benchmark*.yml"
      - ".github/workflows/examples.yml"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  GODOT_VERSION: "4.6.2"
  GDENV_VERSION: "0.2.2"

permissions:
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target

      - name: Cache and install Linux dependencies
        uses: awalsh128/cache-apt-pkgs-action@latest
        with:
          packages: libasound2-dev libudev-dev pkg-config
          version: 1.0

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run clippy
        run: cargo clippy --all-targets -- -D warnings

  test:
    name: test (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    needs: [lint, changes]
    if: needs.changes.outputs.library == 'true' || needs.changes.outputs.itest == 'true'
    strategy:
      matrix:
        # For workflow_dispatch, use only ubuntu-latest (for act compatibility)
        # For push/PR, use the full cross-platform matrix
        os: ${{ github.event_name == 'workflow_dispatch' && fromJson('["ubuntu-latest"]') || fromJson('["ubuntu-latest", "macos-latest", "windows-latest"]') }}
        include:
          - os: ubuntu-latest
            platform: linux
          - os: macos-latest
            platform: macos
          - os: windows-latest
            platform: windows

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target

      - name: Cache and install Linux dependencies
        if: runner.os == 'linux'
        uses: awalsh128/cache-apt-pkgs-action@latest
        with:
          packages: libasound2-dev libudev-dev pkg-config
          version: 1.0

      - name: Run unit tests
        run: |
          cargo test --lib --bins --examples
          cargo test --doc -p godot-bevy -p godot-bevy-macros -p godot-bevy-test -p godot-bevy-test-macros

  api-levels:
    name: api levels
    runs-on: ubuntu-latest
    needs: [changes]
    if: needs.changes.outputs.library == 'true'
    strategy:
      fail-fast: false
      matrix:
        api: [api-4-2, api-4-3, api-4-4, api-4-5, api-4-6]
        feature-flags: ["", "--no-default-features"]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.api }}-${{ matrix.feature-flags }}
          workspaces: . -> target

      - name: Cache and install Linux dependencies
        uses: awalsh128/cache-apt-pkgs-action@latest
        with:
          packages: libasound2-dev libudev-dev pkg-config
          version: 1.0

      - name: Check API level
        run: cargo check -p godot-bevy ${{ matrix.feature-flags }} --features ${{ matrix.api }}

  changes:
    name: detect changes
    runs-on: ubuntu-latest
    outputs:
      library: ${{ steps.manual.outputs.library || steps.filter.outputs.library }}
      itest: ${{ steps.manual.outputs.itest || steps.filter.outputs.itest }}
      qualification: ${{ steps.manual.outputs.qualification || steps.filter.outputs.qualification }}
    steps:
      - uses: actions/checkout@v4

      - name: Manual trigger - run all
        id: manual
        if: github.event_name == 'workflow_dispatch'
        run: |
          echo "library=true" >> $GITHUB_OUTPUT
          echo "itest=true" >> $GITHUB_OUTPUT
          echo "qualification=true" >> $GITHUB_OUTPUT

      - uses: dorny/paths-filter@v3
        id: filter
        if: github.event_name != 'workflow_dispatch'
        with:
          filters: |
            library:
              - 'book-tests/**'
              - 'godot-bevy/**'
              - 'godot-bevy-macros/**'
              - 'godot-bevy-test/**'
              - 'godot-bevy-test-macros/**'
              - '.github/workflows/ci.yml'
              - 'Cargo.toml'
              - 'Cargo.lock'
            itest:
              - 'itest/**'
              - 'examples/platformer-2d/**'
              - '.github/workflows/ci.yml'
            qualification:
              - '.cargo/mutants.toml'
              - 'devenv.nix'
              - 'itest/schema/**'
              - 'itest/faults/**'
              - 'itest/fixtures/qualification/**'
              - 'itest/qualification*.py'
              - 'itest/qualification/**'
              - 'itest/test_qualification.py'
              - 'itest/verify-qualification.sh'
              - '.github/workflows/qualification.yml'
              - '.github/workflows/coverage.yml'
              - '.github/workflows/ci.yml'

  qualification-static:
    name: qualification static contract
    runs-on: ubuntu-latest
    needs: [changes]
    if: |
      needs.changes.outputs.library == 'true' ||
      needs.changes.outputs.itest == 'true' ||
      needs.changes.outputs.qualification == 'true'
    steps:
      - uses: actions/checkout@v4
      - name: Verify qualification evidence contract
        run: ./itest/verify-qualification.sh contract
      - name: Verify fault patch applicability
        run: ./itest/verify-qualification.sh faults
      - name: Verify tolerance and no-op audit
        run: ./itest/verify-qualification.sh assertions
      - name: Verify coverage evidence contract
        run: ./itest/verify-coverage.sh contract

  # For local testing with act: act workflow_dispatch -j integration-tests --container-architecture linux/amd64
  integration-tests:
    name: integration tests (${{ matrix.profile }})
    runs-on: ubuntu-latest
    needs: [lint, changes]
    env:
      ITEST_DENY_FOCUS: "1"
    if: |
      always() &&
      (github.event_name == 'workflow_dispatch' ||
       needs.changes.outputs.library == 'true' ||
       needs.changes.outputs.itest == 'true')
    strategy:
      # Run both profiles even if one fails -- debug and release exercise different
      # code paths (release-only panics vs debug bulk GDScript), so both signals matter.
      fail-fast: false
      matrix:
        profile: [debug, release]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.profile }}
          workspaces: |
            . -> target
            itest/rust -> target

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libudev-dev pkg-config

      - name: Install Godot
        uses: bytemeadow/gdenv@v0.2.2
        with:
          version: ${{ env.GODOT_VERSION }}
          gdenv-version: ${{ env.GDENV_VERSION }}
          use-dotnet: false
          include-templates: false
          cache: true

      - name: Cache Godot imports
        uses: actions/cache@v4
        with:
          path: itest/godot/.godot
          key: ${{ runner.os }}-godot-imports-itest-${{ hashFiles('itest/godot/**/*.import') }}
          restore-keys: |
            ${{ runner.os }}-godot-imports-itest-

      - name: Run integration tests
        working-directory: itest
        env:
          GODOT4_BIN: godot
        run: ./run-tests.sh ${{ matrix.profile == 'release' && '--release' || '' }} --json ../target/itest-${{ matrix.profile }}.json

      - name: Run platformer integration tests
        env:
          GODOT4_BIN: godot
          GODOT: godot
        # The first run also does the headless import, which can segfault on exit once a
        # GDExtension is loaded (godotengine/godot#111645) after .godot is already written.
        # Retrying once then skips the import and just runs the tests.
        run: |
          CMD="cargo run ${{ matrix.profile == 'release' && '--release' || '' }} --features itest --manifest-path examples/platformer-2d/rust/Cargo.toml"
          $CMD || { test -d examples/platformer-2d/godot/.godot && $CMD; }

      - name: Upload integration test report
        # skipped under act: no artifact service locally (ACTIONS_RUNTIME_TOKEN)
        if: ${{ always() && !env.ACT }}
        uses: actions/upload-artifact@v4
        with:
          name: itest-report-${{ matrix.profile }}
          path: target/itest-${{ matrix.profile }}.json
          if-no-files-found: warn
