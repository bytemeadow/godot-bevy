name: examples

on:
  push:
    branches: [main, develop]
    paths:
      - "godot-bevy/**"
      - "godot-bevy-macros/**"
      - "examples/**"
      - ".github/workflows/examples.yml"
      - "Cargo.toml"
  pull_request:
    branches: [main, develop]
    paths:
      - "godot-bevy/**"
      - "godot-bevy-macros/**"
      - "examples/**"
      - ".github/workflows/examples.yml"
      - "Cargo.toml"

env:
  CARGO_TERM_COLOR: always
  GODOT_VERSION: "4.6.2"
  GDENV_VERSION: "0.2.2"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: detect changes
    runs-on: ubuntu-latest
    outputs:
      examples: ${{ steps.filter.outputs.changes }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            perf-test:
              - 'godot-bevy/**'
              - 'godot-bevy-macros/**'
              - 'examples/perf-test/**'
              - '.github/workflows/examples.yml'
              - 'Cargo.toml'
            simple-node2d-movement:
              - 'godot-bevy/**'
              - 'godot-bevy-macros/**'
              - 'examples/simple-node2d-movement/**'
              - '.github/workflows/examples.yml'
              - 'Cargo.toml'
            dodge-the-creeps-2d:
              - 'godot-bevy/**'
              - 'godot-bevy-macros/**'
              - 'examples/dodge-the-creeps-2d/**'
              - '.github/workflows/examples.yml'
              - 'Cargo.toml'
            platformer-2d:
              - 'godot-bevy/**'
              - 'godot-bevy-macros/**'
              - 'examples/platformer-2d/**'
              - '.github/workflows/examples.yml'
              - 'Cargo.toml'

  build:
    name: build ${{ matrix.example }} (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    needs: changes
    if: needs.changes.outputs.examples != '[]'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        example: ${{ fromJson(needs.changes.outputs.examples) }}
        exclude:
          - example: ""
        include:
          - os: ubuntu-latest
            platform: linux
          - os: macos-latest
            platform: macos
          - os: windows-latest
            platform: windows

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target

      - name: Cache and install Linux dependencies
        if: runner.os == 'linux'
        uses: awalsh128/cache-apt-pkgs-action@latest
        with:
          packages: libasound2-dev libudev-dev pkg-config
          version: 1.0

      - name: Build example library
        run: cargo build --release --manifest-path examples/${{ matrix.example }}/rust/Cargo.toml

      - name: Upload example libraries
        uses: actions/upload-artifact@v4
        with:
          name: example-libs-${{ matrix.example }}-${{ runner.os }}
          path: |
            target/release/*.so
            target/release/*.dylib
            target/release/*.dll
          if-no-files-found: warn

  export:
    name: export (${{ matrix.example }})
    runs-on: macos-latest
    needs: [build, changes]
    if: contains(needs.changes.outputs.examples, 'dodge-the-creeps-2d') || contains(needs.changes.outputs.examples, 'platformer-2d')
    strategy:
      fail-fast: false
      matrix:
        example: [dodge-the-creeps-2d, platformer-2d]
        exclude:
          - example: ${{ !contains(needs.changes.outputs.examples, 'dodge-the-creeps-2d') && 'dodge-the-creeps-2d' || 'none' }}
          - example: ${{ !contains(needs.changes.outputs.examples, 'platformer-2d') && 'platformer-2d' || 'none' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Godot
        uses: bytemeadow/gdenv@v0.2.2
        with:
          version: ${{ env.GODOT_VERSION }}
          gdenv-version: ${{ env.GDENV_VERSION }}
          use-dotnet: false
          include-templates: true
          cache: true

      - name: Download all platform libraries
        uses: actions/download-artifact@v4
        with:
          pattern: example-libs-${{ matrix.example }}-*
          path: artifacts/

      - name: Setup cross-platform libraries
        run: |
          mkdir -p target/release target/debug

          # Copy all platform libraries to both release and debug directories
          # (Godot import runs in debug mode, export uses release)
          find artifacts/ -type f \( -name "*.so" -o -name "*.dylib" -o -name "*.dll" \) | while read file; do
            cp "$file" target/release/
            cp "$file" target/debug/
          done

          echo "Available libraries:"
          ls -la target/release/

      - name: Generate GDExtension descriptor
        working-directory: examples/${{ matrix.example }}/godot
        run: |
          # The launcher generates this ignored file; CI exports without running it.
          crate=$(python3 -c 'import tomllib; print(tomllib.load(open("../rust/Cargo.toml", "rb"))["package"]["name"].replace("-", "_"))')
          cat > rust.gdextension <<EOF
          [configuration]
          entry_symbol = "gdext_rust_init"
          compatibility_minimum = 4.1
          reloadable = true

          [libraries]
          linux.release.x86_64 =   "res://../../../target/release/lib${crate}.so"
          windows.release.x86_64 = "res://../../../target/release/${crate}.dll"
          macos.release =          "res://../../../target/release/lib${crate}.dylib"
          macos.release.arm64 =    "res://../../../target/release/lib${crate}.dylib"
          linux.debug.x86_64 =     "res://../../../target/debug/lib${crate}.so"
          windows.debug.x86_64 =   "res://../../../target/debug/${crate}.dll"
          macos.debug =            "res://../../../target/debug/lib${crate}.dylib"
          macos.debug.arm64 =      "res://../../../target/debug/lib${crate}.dylib"
          EOF

      - name: Cache Godot imports
        uses: actions/cache@v4
        with:
          path: examples/${{ matrix.example }}/godot/.godot
          key: ${{ runner.os }}-godot-imports-${{ matrix.example }}-${{ hashFiles(format('examples/{0}/godot/**/*.import', matrix.example)) }}
          restore-keys: |
            ${{ runner.os }}-godot-imports-${{ matrix.example }}-

      - name: Import Godot project
        working-directory: examples/${{ matrix.example }}/godot
        run: godot --editor --headless --quit || true

      - name: Export for all platforms
        working-directory: examples/${{ matrix.example }}/godot
        run: |
          mkdir -p exports
          godot --headless --export-release "Linux/X11" exports/${{ matrix.example }}-linux
          godot --headless --export-release "Windows Desktop" exports/${{ matrix.example }}-windows.exe
          godot --headless --export-release "macOS" exports/${{ matrix.example }}-macos.app

      - name: Smoke-launch macOS export
        working-directory: examples/${{ matrix.example }}/godot
        shell: bash
        run: |
          app=$(ls -d exports/${{ matrix.example }}-macos.app/Contents/MacOS/*)
          chmod +x "$app"
          "$app" --headless --fixed-fps 60 --quit-after 300 2>&1 | tee exports/macos-smoke.log
          grep -q 'Initialize godot-rust' exports/macos-smoke.log
          if grep -q 'Cannot get class' exports/macos-smoke.log; then
            exit 1
          fi

      - name: Upload game exports
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.example }}-exports
          path: examples/${{ matrix.example }}/godot/exports/
          if-no-files-found: error

  build-web:
    name: build simple-node2d-movement (wasm)
    runs-on: ubuntu-latest
    needs: changes
    if: contains(needs.changes.outputs.examples, 'simple-node2d-movement')

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust nightly toolchain
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target

      - name: Cache and install Linux dependencies
        uses: awalsh128/cache-apt-pkgs-action@latest
        with:
          packages: libasound2-dev libudev-dev pkg-config
          version: 1.0

      - name: Install Godot
        uses: bytemeadow/gdenv@v0.2.2
        with:
          version: ${{ env.GODOT_VERSION }}
          gdenv-version: ${{ env.GDENV_VERSION }}
          use-dotnet: false
          include-templates: false
          cache: true

      - name: Setup Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: 3.1.73

      - name: Verify Emscripten
        run: emcc --version

      - name: Generate extension_api.json
        run: godot --headless --dump-extension-api
        working-directory: examples

      - name: Build for WASM
        working-directory: examples/simple-node2d-movement
        env:
          GODOT4_GDEXTENSION_JSON: ${{ github.workspace }}/examples/extension_api.json
        run: ./build-web.sh release

      - name: Upload WASM artifact
        uses: actions/upload-artifact@v4
        with:
          name: simple-node2d-movement-wasm
          path: |
            target/wasm32-unknown-emscripten/release/simple_node2d_movement_example.wasm
            target/wasm32-unknown-emscripten/release/simple_node2d_movement_example.threads.wasm
          if-no-files-found: error
