<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Simple Node2D Movement</title>
  <link rel="icon" href="data:,">
  $GODOT_HEAD_INCLUDE
  <style>
    html, body { margin: 0; height: 100%; background: black; }
    canvas { display: block; width: 100%; height: 100%; }
  </style>
</head>
<body>
  <canvas id="canvas" tabindex="0"></canvas>
  <script src="$GODOT_URL"></script>
  <script>
    const probing = new URLSearchParams(location.search).get("capture-browser") === "1";
    window.browserCapture = {
      ready: false,
      paused: false,
      frame: null,
      scene: null,
      godot: null,
      threaded: null,
      advance: null,
    };
    const engine = new Engine($GODOT_CONFIG);
    engine.startGame({
      args: probing ? ["--scene", "res://browser/orbit.tscn"] : [],
      onPrint: (...args) => console.log(...args),
      onPrintError: (...args) => console.error(...args),
      onExit: (code) => console.error(`Godot exited with code ${code}`),
    }).catch((error) => console.error(error));
  </script>
</body>
</html>
