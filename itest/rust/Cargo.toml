[package]
name = "godot-bevy-itest"
version = "0.0.0"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib"]

[[bin]]
path = "run_godot.rs"
name = "godot_bevy_itest"

[features]
default = []
test-frame-signal = ["godot-bevy/test-frame-signal", "godot-bevy-test/test-frame-signal"]
autosync-tests = []
harness-probes = []
harness-focus-probe = ["harness-probes"]
coverage-flush = []
profile-tracy = [
    "godot-bevy/trace_bevy",
    "godot-bevy/trace_tracy",
    "godot-bevy-test/profile-tracy",
]

[dependencies]
godot = { workspace = true }
godot-bevy = { path = "../../godot-bevy", features = ["register-docs"] }
godot-bevy-test = { path = "../../godot-bevy-test" }
bevy = { version = "0.20", default-features = false, features = [
  "bevy_asset",
  "multi_threaded",
] }
crossbeam-channel = "0.5"
cargo-godot-lib.workspace = true

# Ecosystem input crates exercised by input_ecosystem_tests.rs. These are real
# dependencies (not dev-dependencies): itest is a cdylib whose tests compile into
# the lib target.
leafwing-input-manager = { git = "https://github.com/Leafwing-Studios/leafwing-input-manager" }
bevy_enhanced_input = { git = "https://github.com/projectharmonia/bevy_enhanced_input" }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(coverage)"] }
