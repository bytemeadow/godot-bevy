[package]
name = "godot-bevy-test"
description = "Integration testing framework for godot-bevy projects"
version.workspace = true
edition.workspace = true
authors.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true
license.workspace = true

[features]
test-frame-signal = ["godot-bevy/test-frame-signal"]
profile-tracy = [
    "dep:tracing",
    "dep:tracing-subscriber",
    "dep:tracing-tracy",
    "godot-bevy/trace_bevy",
    "godot-bevy/trace_tracy",
]

[dependencies]
godot = { workspace = true, features = ["__trace"] }
godot-bevy = { workspace = true }
godot-bevy-test-macros = { workspace = true }
bevy = { version = "0.19", default-features = false, features = [
    "bevy_asset",
    "multi_threaded",
] }
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
chrono = "0.4"
tracing = { version = "0.1", default-features = false, features = ["std"], optional = true }
tracing-subscriber = { version = "0.3.19", default-features = false, features = ["fmt", "registry"], optional = true }
tracing-tracy = { version = "0.11.4", default-features = false, features = [
    "enable",
    "flush-on-exit",
    "ondemand",
    "only-localhost",
], optional = true }
